version: '3'
# Persistent state lives in three places, back them up together (see docs/installation.md):
#   - the `mongo-data` named volume (database `pwndoc`: audits, vulnerabilities, images, users, settings)
#   - ./backend/report-templates (the .docx files of the report templates)
#   - ./backend/src/config (config.json with the generated JWT secrets, roles.json, report-styles.json)
# The volume is named after the compose project (the directory name by default): keep the same
# directory name or set COMPOSE_PROJECT_NAME when moving the checkout, otherwise a new empty
# volume is created. Container names are referenced by config.json and the frontend nginx.conf.
services:
  mongodb:
    image: mongo:4.4
    container_name: mongo-pwndoc-ng
    volumes:
      - mongo-data:/data/db
    restart: always
    ports:
      - 127.0.0.1:27017:27017
    environment:
      - MONGO_DB:pwndoc
    networks:
      - backend

  backend:
    build: ./backend
    image: pwndoc-ng/pwndoc-ng:backend
    container_name: pwndoc-ng-backend
    volumes:
      - ./backend/report-templates:/app/report-templates
      - ./backend/src/config:/app/src/config
    depends_on:
      - mongodb
    environment:
      - COLLAB_WEBSOCKET_PORT=8440
    restart: always
    ports:
      - 4242:4242
    links:
      - mongodb
    networks:
      - backend

  frontend:
    build: ./frontend
    image: pwndoc-ng/pwndoc-ng:frontend
    container_name: pwndoc-ng-frontend
    restart: always
    environment:
      - Java_Xms=512m
      - Java_Xmx=2g
    ports:
      - 8443:8443
    networks:
      - backend
  languagetool:
    image: erikvl87/languagetool
    container_name: pwndoc-ng-languagetool
    restart: always
    networks:
      - backend

volumes:
  mongo-data:

networks:
  backend:
      driver: bridge
