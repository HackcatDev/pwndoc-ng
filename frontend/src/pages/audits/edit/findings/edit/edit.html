<template>
    <div>
      <breadcrumb
        buttons
        :title="localAudit?.name ? `${localAudit.name} (${localAudit.auditType || 'Audit Type not set'})` : 'Loading...'"
        :state="parentState"
        :approvals="parentApprovals"
      >
        <template #buttons>
          <q-btn
            color="orange"
            class="q-mr-sm"
            :label="$t('btn.backupFinding')"
            no-caps
            @click="backupFinding()"
          />
          <q-btn
            color="negative"
            class="q-mr-sm"
            :label="$t('btn.delete')"
            no-caps
            @click="deleteFinding()"
            v-if="frontEndAuditState === AUDIT_VIEW_STATE.EDIT"
          />
          <q-btn
            color="positive"
            :disable="!readyToSave"
            :label="$t('btn.save') + ' (ctrl+s)'"
            no-caps
            @click="updateFinding()"
            v-if="frontEndAuditState === AUDIT_VIEW_STATE.EDIT"
          />
        </template>
      </breadcrumb>
  
      <div class="row">
        <q-tabs
          v-model="selectedTab"
          align="left"
          indicator-color="primary"
          active-bg-color="grey-3"
          class="bg-white full-width"
        >
          <q-tab name="definition" default :label="$t('definition')" />
          <q-tab name="proofs" :label="$t('proofs')" />
          <q-tab name="details" :label="$t('details')" />
          <template v-if="frontEndAuditState === AUDIT_VIEW_STATE.EDIT">
            <q-separator vertical />
            <q-toggle
              :label="$t('completed')"
              v-model="finding.status"
              :true-value="0"
              :false-value="1"
              checked-icon="check"
              unchecked-icon="clear"
              color="green"
            />
          </template>
          <q-space />
        </q-tabs>
  
        <q-tab-panels
          v-model="selectedTab"
          animated
          class="bg-transparent col-md-8 col-12 offset-md-2 q-mt-md"
          @before-transition="syncEditors"
          @transition="updateOrig"
        >
          <!-- DEFINITION -->
          <q-tab-panel name="definition">
            <q-card>
              <q-card-section class="row q-col-gutter-md">
                <q-input
                  class="col-md-8 col-12"
                  :label="$t('title') + ' *'"
                  stack-label
                  v-model="finding.title"
                  outlined
                  :readonly="frontEndAuditState !== AUDIT_VIEW_STATE.EDIT || !!aiBusy.title"
                >
                  <template v-slot:after v-if="aiAvailable">
                    <ai-button :loading="!!aiBusy.title" @click="aiGenerate('title')" />
                  </template>
                </q-input>
                <q-select
                  class="col-md-4 col-12"
                  :label="$t('type')"
                  v-model="finding.vulnType"
                  :options="filteredVulnTypes"
                  option-value="name"
                  option-label="name"
                  use-input
                  input-debounce="0"
                  @filter="filterType"
                  emit-value
                  map-options
                  options-sanitize
                  outlined
                  :readonly="frontEndAuditState !== AUDIT_VIEW_STATE.EDIT"
                />
                <q-field class="col-md-12 basic-editor" borderless :label="$t('description')" stack-label>
                  <template #control>
                    <basic-editor
                      ref="basiceditor_description"
                      v-model="finding.description"
                      v-on:editorchange="readyToSave ? needSave = true : null"
                      v-on:ready="readyToSave = true"
                      idUnique="basiceditor_description"
                      noSync
                      :editable="frontEndAuditState === AUDIT_VIEW_STATE.EDIT && !aiBusy.description"
                    />
                  </template>
                  <template v-slot:after v-if="aiAvailable">
                    <ai-button :loading="!!aiBusy.description" @click="aiGenerate('description')" />
                  </template>
                </q-field>
                <q-field class="col-md-12 basic-editor" borderless :label="$t('observation')" stack-label>
                  <template #control>
                    <basic-editor
                      ref="basiceditor_observation"
                      v-model="finding.observation"
                      v-on:editorchange="readyToSave ? needSave = true : null"
                      idUnique="basiceditor_observation"
                      noSync
                      :editable="frontEndAuditState === AUDIT_VIEW_STATE.EDIT && !aiBusy.observation"
                    />
                  </template>
                  <template v-slot:after v-if="aiAvailable">
                    <ai-button :loading="!!aiBusy.observation" @click="aiGenerate('observation')" />
                  </template>
                </q-field>
                <div class="col-12 row no-wrap items-start">
                  <textarea-array
                    class="col"
                    :label="$t('references')"
                    v-model="finding.references"
                    :readonly="frontEndAuditState !== AUDIT_VIEW_STATE.EDIT || !!aiBusy.references"
                  />
                  <div class="col-auto q-pl-xs q-pt-sm" v-if="aiAvailable">
                    <ai-button :loading="!!aiBusy.references" @click="aiGenerate('references')" />
                  </div>
                </div>
              </q-card-section>
  
              <q-expansion-item
                :label="$t('customFields')"
                v-if="finding.customFields !== undefined"
                default-opened
                header-class="bg-blue-grey-5 text-white"
                expand-icon-class="text-white"
              >
   
              <custom-fields
              ref="customfields"
              v-model="finding.customFields"
              :category="finding.category || ''"
              :idUnique="finding._id"
              custom-element="QCardSection"
              :locale="audit?.language || 'en'"
              :ai-fields="aiCustomFields"
              :ai-busy="aiBusy"
              @ai="aiGenerate($event.key, $event.fieldId)"
            />


            
              </q-expansion-item>
            </q-card>
          </q-tab-panel>
  
          <!-- PROOFS -->
          <q-tab-panel name="proofs">
            <div class="q-col-gutter-md row">
              <div class="col-12">
                <q-card>
                  <q-card-section>
                    <basic-editor
                      ref="basiceditor_poc"
                      v-model="finding.poc"
                      v-on:editorchange="readyToSave ? needSave = true : null"
                      idUnique="basiceditor_poc"
                      noSync
                      :editable="frontEndAuditState === AUDIT_VIEW_STATE.EDIT"
                    />
                  </q-card-section>
                </q-card>
              </div>
            </div>
          </q-tab-panel>
  
          <!-- DETAILS -->
          <q-tab-panel name="details">
            <q-card>
              <q-card-section>{{ $t('affectedAssets') }}</q-card-section>
              <q-separator />
              <q-card-section>
                <q-field borderless>
                  <template #control>
                    <basic-editor
                      v-model="finding.scope"
                      idUnique="basiceditor_scope"
                      v-on:editorchange="readyToSave ? needSave = true : null"
                      :editable="frontEndAuditState === AUDIT_VIEW_STATE.EDIT"
                    />
                  </template>
                </q-field>
              </q-card-section>
            </q-card>
  
            <q-card class="q-mt-md bg-grey-1">
              <div class="col-12">
                <cvss-calculator
                  v-model="finding.cvssv3"
                  :readonly="frontEndAuditState !== AUDIT_VIEW_STATE.EDIT"
                />
              </div>
            </q-card>
  
            <q-card class="q-mt-md">
              <q-card-section>{{ $t('courseOfActions') }}</q-card-section>
              <q-separator />
              <q-card-section>
                <div class="q-col-gutter-md row">
                  <q-select
                    :label="$t('remediationDifficulty')"
                    stack-label
                    class="col-md-6 col-12"
                    v-model="finding.remediationComplexity"
                    :options="[
                      { label: $t('easy'), value: 1 },
                      { label: $t('medium'), value: 2 },
                      { label: $t('complex'), value: 3 }
                    ]"
                    map-options
                    emit-value
                    options-sanitize
                    outlined
                    :readonly="frontEndAuditState !== AUDIT_VIEW_STATE.EDIT"
                  />
                  <q-select
                    :label="$t('priority')"
                    stack-label
                    class="col-md-6 col-12"
                    v-model="finding.priority"
                    :options="[
                      { label: $t('low'), value: 1 },
                      { label: $t('medium'), value: 2 },
                      { label: $t('high'), value: 3 },
                      { label: $t('urgent'), value: 4 }
                    ]"
                    map-options
                    emit-value
                    options-sanitize
                    outlined
                    :readonly="frontEndAuditState !== AUDIT_VIEW_STATE.EDIT"
                  />
                </div>
                <q-field class="col-md-12 basic-editor q-mt-md" borderless :label="$t('remediation')" stack-label>
                  <template #control>
                    <basic-editor
                      ref="basiceditor_remediation"
                      v-model="finding.remediation"
                      v-on:editorchange="readyToSave ? needSave = true : null"
                      idUnique="basiceditor_remediation"
                      noSync
                      :editable="frontEndAuditState === AUDIT_VIEW_STATE.EDIT && !aiBusy.remediation"
                    />
                  </template>
                  <template v-slot:after v-if="aiAvailable">
                    <ai-button :loading="!!aiBusy.remediation" @click="aiGenerate('remediation')" />
                  </template>
                </q-field>
              </q-card-section>
            </q-card>
          </q-tab-panel>
        </q-tab-panels>
      </div>
    
    <!-- AI assistant: new title to compare with the current one -->
    <q-dialog v-model="aiTitle.show">
      <q-card style="width: 700px; max-width: 90vw">
        <q-bar class="bg-fixed-primary text-white">
          <q-icon name="fa fa-magic" />
          <div class="q-toolbar-title">{{ $t('ai.titleDialog') }}</div>
          <q-space />
          <q-btn dense flat icon="close" v-close-popup />
        </q-bar>
        <q-card-section>
          <div class="text-caption text-grey-7">{{ $t('ai.titleCurrent') }}</div>
          <div class="q-mb-md text-body1">{{ aiTitle.current }}</div>
          <q-input outlined autogrow stack-label :label="$t('ai.titleProposed') + (aiTitle.model ? ' (' + aiTitle.model + ')' : '')" v-model="aiTitle.proposed" autofocus />
        </q-card-section>
        <q-card-actions align="right">
          <q-btn flat color="primary" no-caps :label="$t('btn.cancel')" v-close-popup />
          <q-btn unelevated color="secondary" no-caps :label="$t('ai.replace')" :disable="!aiTitle.proposed.trim()" @click="aiReplaceTitle()" />
        </q-card-actions>
      </q-card>
    </q-dialog>
</div>
  </template>
